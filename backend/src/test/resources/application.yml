spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: none
  mail:
    host: localhost
    port: 1025
app:
  security:
    enabled: ${SECURITY_ENABLED:false}